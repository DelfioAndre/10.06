<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lety</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: clamp(12px, 4vw, 32px);
            background: #f1e6dc;
        }
        main {
            width: min(100%, 520px);
            min-height: min(680px, calc(100vh - 24px));
            padding: clamp(16px, 5vw, 32px);
            position: relative;
            overflow: hidden;
            border-radius: clamp(18px, 5vw, 28px);
            border: clamp(2px, 1vw, 4px) solid rgba(177, 48, 48, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        main::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url("IMG-20260820-WA0038.jpg") center / contain no-repeat;
            opacity: 0.7;
            pointer-events: none;
        }
        main > divi {
            position: relative;
        }
        divi {
            color: #fff;
            padding: 18px;
            border-radius: 22px;
            text-align: center;
        }
        main > divi:first-child {
            flex: 1;
            display: grid;
            place-items: center;
            margin-bottom: 18px;
        }
        main > divi:last-child {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 {
            max-width: 100%;
            margin: 0;
            font-size: clamp(1.7rem, 7vw, 2.4rem);
            overflow-wrap: anywhere;
        }
        p {
            margin: 0;
            flex: 1 1 110px;
            max-width: 180px;
            padding: 12px 18px;
            border-radius: 10px;
            background: rgba(150, 37, 37, 0.425);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        p:hover,
        p:focus {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            outline: none;
        }
        @media (max-width: 360px) {
            main {
                min-height: calc(100vh - 24px);
            }

            main > divi:last-child {
                gap: 8px;
            }

            p {
                flex-basis: 100%;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <divi>
            <h1>Quer namorar comigo?</h1>
        </divi>
        <divi aria-label="Opções">
            <p role="button" tabindex="0" onclick="responder()" onkeydown="if (event.key === 'Enter' || event.key === ' ') responder()">Sim</p>
            <p role="button" tabindex="0" onclick="responder()" onkeydown="if (event.key === 'Enter' || event.key === ' ') responder()">Sim</p>
        </divi>
    
    </main>
    <script>
        function responder() {
            alert('Eu sabia que você diria sim!');
        }
    </script>

</body>
</html>
